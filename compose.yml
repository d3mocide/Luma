services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${LUMA_HTTPS_PORT:-443}:443"
      - "${LUMA_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev"]
    environment:
      VITE_API_TARGET: http://api:8000
      VITE_PORT: 5173
      VITE_USE_MOCK_DATA: ${VITE_USE_MOCK_DATA:-1}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-0}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-200}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["dev"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: &api-env
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      HAE_SHARED_SECRET: ${HAE_SHARED_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOCAL_AI_API_BASE: ${LOCAL_AI_API_BASE}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY}
      FOOD_EXTRACTOR_MODEL: ${FOOD_EXTRACTOR_MODEL}
      VISION_CLASSIFIER_MODEL: ${VISION_CLASSIFIER_MODEL}
      MEAL_PLANNER_MODEL: ${MEAL_PLANNER_MODEL}
      COACH_MODEL: ${COACH_MODEL}
      INSIGHT_NARRATOR_MODEL: ${INSIGHT_NARRATOR_MODEL}
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "luma.worker.settings.WorkerSettings"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg16-ts2.16
    volumes:
      - pgdata:/home/postgres/pgdata/data
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: sh
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sh -d luma"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
    volumes:
      # Persist downloaded model weights across container restarts.
      # base.en is baked into the image; any other model downloads here on first start.
      - whisper_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
  whisper_model_cache:
