[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luma"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.137.1",
    "uvicorn[standard]==0.48.0",

    # Database
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.4",

    # Validation
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",

    # Auth
    "argon2-cffi==25.1.0",
    "pyjwt==2.13.0",

    # HTTP client
    "httpx==0.28.1",

    # Task queue
    "arq==0.28.0",
    "redis==5.3.1",
    "msgpack>=1.2.1",

    # Utilities
    "python-multipart==0.0.31",
    "python-dateutil==2.9.0.post0",
    "orjson==3.11.9",
    "litellm==1.89.1",
    "tzdata==2025.2",
    "pywebpush==2.3.0",

    # ML — anomaly detection
    "scikit-learn==1.6.1",

    # Email — async SMTP for family invitation emails
    "aiosmtplib==5.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx==0.36.2",
    "httpx==0.28.1",
    "factory-boy==3.3.3",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "pip-tools>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["luma"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["^tests/", "^alembic/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
disable_error_code = ["import-untyped"]
