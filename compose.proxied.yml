# Compose override for deployments behind an external reverse proxy (nginx, Caddy, etc.)
# The upstream proxy handles TLS — Luma's internal nginx serves plain HTTP.
#
# Usage:
#   docker compose -f compose.yml -f compose.proxied.yml up -d
#
# Required .env additions:
#   LUMA_HTTP_PORT=8080       — host port your outer proxy connects to
#   LUMA_HTTPS_PORT=8443      — avoids conflict with outer proxy on 443 (no listener inside)
#
# Your outer nginx proxy_pass block should look like:
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header Host              $host;
#   }

services:
  frontend:
    # Mount the HTTP-only nginx config over the SSL one baked into the image.
    # Docker applies mounts in order; this entry (from the override) wins for the same target.
    volumes:
      - ./nginx/conf.d/luma-proxied.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    # Trust X-Forwarded-For and X-Forwarded-Proto from the upstream proxy.
    # Without --proxy-headers, FastAPI sees the internal nginx IP as the client,
    # and $scheme is always "http" — breaking Secure cookies and CORS.
    command:
      - uvicorn
      - luma.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
