<svg xmlns="http://www.w3.org/2000/svg" width="480" height="110" viewBox="0 0 480 110" role="img" aria-label="Luma — health tracking · meal planning · private by design">
  <!-- Background: deep nightlit ocean -->
  <rect width="480" height="110" rx="16" fill="#080d1a"/>

  <!-- Atmospheric glows -->
  <ellipse cx="55" cy="5"  rx="170" ry="80"  fill="rgba(56,189,248,0.13)"/>
  <ellipse cx="460" cy="50" rx="100" ry="70" fill="rgba(251,191,36,0.07)"/>

  <!-- Border -->
  <rect width="480" height="110" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!--
    Logo mark — coordinates pre-computed from:
      original viewBox 445 272 390 270  →  target 60 × 41.5 px at offset (22, 34)
      scale = 60/390 = 0.15385
      dx = 22 − 445 × 0.15385 = 22 − 68.46 = −46.46
      dy = 34 − 272 × 0.15385 = 34 − 41.85 = −7.85

    Sun circle:  cx=665→55.7  cy=365→48.3  r=66→10.2
    Hill path (scaled):
      M450→23.7, 530→73.6
      Q550→38.2, 530→73.6  590→44.2, 405→54.5
      Q640→52.0, 280→35.2  690→59.7, 405→54.5
      Q740→67.5, 530→73.6  830→81.9, 530→73.6
    Mask fill path (same + V100 H22 Z):
  -->
  <defs>
    <mask id="luma-banner-hill" maskUnits="userSpaceOnUse">
      <rect width="480" height="110" fill="white"/>
      <path d="M23.7 73.6 Q38.2 73.6 44.2 54.5 Q52.0 35.2 59.7 54.5 Q67.5 73.6 81.9 73.6 V110 H22 Z" fill="black"/>
    </mask>
  </defs>

  <!-- Sun -->
  <circle cx="55.7" cy="48.3" r="10.2" fill="#fbbf24" mask="url(#luma-banner-hill)"/>

  <!-- Hill stroke -->
  <path d="M23.7 73.6 Q38.2 73.6 44.2 54.5 Q52.0 35.2 59.7 54.5 Q67.5 73.6 81.9 73.6"
    stroke="#0ea5e9" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark: luma -->
  <text
    x="108" y="57"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="38" font-weight="300" letter-spacing="-1.5"
    fill="#f6f9ff"
  >luma</text>

  <!-- Tagline -->
  <text
    x="109" y="77"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="12" font-weight="400" letter-spacing="0.2"
    fill="rgba(246,249,255,0.45)"
  >health tracking · meal planning · private by design</text>
</svg>
