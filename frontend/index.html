<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luma" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/luma-glyph-light.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>Luma</title>
    <!-- Viewport height: dvh = the dynamic (visible) viewport so the bottom nav
         stays reachable in a normal Safari tab; in the installed PWA we override
         to lvh (full screen incl. home-indicator strip, static → stable at cold
         start). 100vh is the fallback for engines without dvh/lvh. -->
    <style>html,body,#root{height:100vh;height:100dvh;overflow:hidden}@media (display-mode:standalone){html,body,#root{height:100lvh}}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
