<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luma" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/assets/luma-glyph-light.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>Luma</title>
    <!-- iOS standalone PWA: html/body/#root must use the LARGE viewport height
         (100lvh = full screen incl. home-indicator strip), not 100% / 100svh /
         innerHeight (= the shorter visual viewport), or this clipping cage cuts
         the app shell short and the bare <body> background shows as a bottom bar.
         100vh is an equivalent fallback for engines without lvh. -->
    <style>html,body,#root{height:100vh;height:100lvh;overflow:hidden}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
